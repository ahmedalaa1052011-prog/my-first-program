let catsDiv=document.createElement('div');catsDiv.style.margin='8px 0';
let allBtn=document.createElement('span');allBtn.className='catBtn sel';allBtn.innerText='الكل ('+total+')';allBtn.onclick=function(){curCat='الكل';curPage=1;lastSearch='';document.querySelectorAll('.catBtn').forEach(function(b){b.classList.remove('sel');});allBtn.classList.add('sel');renderGrammar();};catsDiv.appendChild(allBtn);
let cats = cur.n=='العربية' ? ['النحو','الصرف','الإعراب','البلاغة','الإملاء','الأدوات'] : ['الجمل','الأزمنة','الأسئلة','الصفات','حروف الجر'];
cats.forEach(function(c){let s=document.createElement('span');s.className='catBtn';s.innerText=c;s.onclick=function(){curCat=c;curPage=1;lastSearch='';document.querySelectorAll('.catBtn').forEach(function(b){b.classList.remove('sel');});s.classList.add('sel');renderGrammar();};catsDiv.appendChild(s);});
d.appendChild(catsDiv);
let box=document.createElement('div');box.id='grammarBox';d.appendChild(box);
let nav=document.createElement('div');nav.style.display='flex';nav.style.gap='8px';nav.style.marginTop='10px';
let prev=btn('⬅️ الصفحة اللي قبلها','',function(){if(curPage>1){curPage--;renderGrammar();window.scrollTo(0,0);}});prev.className='btn';prev.style.flex='1';
let next=btn('الصفحة اللي بعدها ➡️','#22c55e',function(){let all=getGrammarForLang(cur.n);let max=Math.ceil(all.length/perPage);if(curPage<max){curPage++;renderGrammar();window.scrollTo(0,0);}else alert('دي آخر صفحة! خلصت الـ '+(cur.total||50)+' قاعدة!');});next.className='btn';next.style.flex='1';
nav.appendChild(prev);nav.appendChild(next);d.appendChild(nav);
let fin=btn('✅ خلصت القواعد - خد 50 نقطة!','',function(){pts+=50;updatePts();alert('عاش يا أحمد! خلصت قواعد '+cur.n+'! خدت 50 نقطة - مشروعك تحت إشراف أ/ سامح زخاري');go('quiz');});fin.className='btn';d.appendChild(fin);
return d;
}
function renderGrammar(){
let box=document.getElementById('grammarBox');if(!box)return;
let all=getGrammarForLang(cur.n);
let filtered=curCat=='الكل'?all:all.filter(function(r){return r.cat==curCat;});
if(lastSearch)filtered=filtered.filter(function(r){return r.title.indexOf(lastSearch)>=0||r.ar.indexOf(lastSearch)>=0||r.ex.toLowerCase().indexOf(lastSearch.toLowerCase())>=0;});
let start=(curPage-1)*perPage;let pageItems=filtered.slice(start,start+perPage);
box.innerHTML='<p style="text-align:center;color:#666">بيعرض قواعد من '+(start+1)+' لـ '+(start+pageItems.length)+' من '+filtered.length+' قاعدة (الصفحة '+curPage+') - مشروع أحمد علاء أنور</p>';
pageItems.forEach(function(r){
let linesHtml=r.lines.map(function(line,i){return '<div class="line"><span class="n">'+(i+1)+'</span><span>'+line+'</span></div>';}).join('');
let d=document.createElement('div');d.className='rule';
d.innerHTML='<b>قاعدة '+r.num+' / '+(cur.total||50)+' - '+r.title+' <span style="background:#e0e7ff;padding:2px 8px;border-radius:10px;font-size:11px">'+r.cat+'</span></b><br><span style="color:#666">التركيب: '+r.formula+'</span><div class="ex"><b>بالعربي:</b> '+r.ar+'<br><b>بال'+cur.n+':</b> '+r.ex+'</div><div class="explain"><b>📖 شرح القاعدة في 10 سطور - من أحمد:</b>'+linesHtml+'</div>';
let b1=btn('🔊 اسمع المثال','',function(){speakText(r.ex,cur.c);});
let b2=btn('✅ اتعلمتها + 1 نقطة','#7c3aed',function(){rulesLearned++;pts++;updatePts();b2.innerText='✅ اتعلمتها!';b2.style.background='#22c55e';b2.disabled=true;});
let b3=btn('⭐ احفظها','#f59e0b',function(){addFav('قاعدة '+r.num+' - '+r.title);});
d.appendChild(b1);d.appendChild(document.createTextNode(' '));d.appendChild(b2);d.appendChild(document.createTextNode(' '));d.appendChild(b3);box.appendChild(d);
});
updatePts();
}
let qs=[],qi=0,score=0;
function pageQuiz(){let d=document.createElement('div');d.className='card';d.innerHTML='<h3>📝 امتحان القواعد - '+cur.n+' - مشروع أحمد - من الـ '+(cur.total||50)+' قاعدة</h3>';let box=document.createElement('div');box.id='quizBox';d.appendChild(box);setTimeout(showQuiz,0);return d;}
function showQuiz(){let rules=getGrammarForLang(cur.n);let picks=[0,3,17,1,9,100,200,300,400,500].filter(function(i){return i<rules.length;});qs=picks.slice(0,5).map(function(idx){let r=rules[idx];return{q:'يا أحمد - قاعدة '+(idx+1)+' - '+r.title+' - إيه المثال الصح؟',o:[r.ex,rules[(idx+1)%rules.length].ex,rules[(idx+2)%rules.length].ex],a:0};});qi=0;score=0;renderQ();}
function renderQ(){let box=document.getElementById('quizBox');if(!box)return;if(qi>=qs.length){box.innerHTML='<h2>🎉 يا أحمد نتيجتك: '+score+'/5</h2><p>مشروعك تحت إشراف أ/ سامح زخاري - عاش!</p>';let b1=btn('🔄 العب تاني','',function(){showQuiz();});b1.className='btn';let b2=btn('📖 ارجع للقواعد','#22c55e',function(){go('grammar');});b2.className='btn';box.appendChild(b1);box.appendChild(b2);if(score>=3){pts+=20;updatePts();}return;}let q=qs[qi];box.innerHTML='<h3>'+q.q+'</h3><div id="quizOpt"></div><p>سؤال '+(qi+1)+' من 5</p>';let optDiv=document.getElementById('quizOpt');q.o.forEach(function(o,i){let b=document.createElement('button');b.innerText=o;b.onclick=function(){if(i==qs[qi].a)score++;qi++;renderQ();};optDiv.appendChild(b);});}
function pageSpeak(){let d=document.createElement('div');d.className='card';d.innerHTML='<h3>🎙️ انطق معايا - '+cur.n+' - مع أحمد</h3>';let base=dict[cur.n]||dict['الإنجليزية'];base.slice(0,3).forEach(function(w){let x=document.createElement('div');x.className='word';x.innerHTML='<div class="arBox"><span class="ar">'+w.ar+' = '+w.for+'</span><span style="color:#7c3aed;font-weight:bold">النطق: '+w.pron+'</span></div>';let b=btn('🔊 اسمع','',function(){speakText(w.for,cur.c);});x.appendChild(b);d.appendChild(x);});let bf=btn('🎤 أنا نطقتها صح - خد 10 نقاط','',function(){pts+=10;updatePts();alert('عاش يا أحمد! نطقك ممتاز! خدت 10 نقاط');});bf.className='btn';d.appendChild(bf);return d;}
function pageStories(){let d=document.createElement('div');d.className='card';d.innerHTML='<h3>📖 قصة - الولد الشاطر - تأليف أحمد علاء أنور</h3><div style="background:#fef3c7;padding:12px;border-radius:12px">بالعربي: كان فيه ولد شاطر اسمه أحمد، بيحب المدرسة، وبيذاكر كل يوم، وبقى دكتور كبير.<br><br>بالإنجليزي: There was a smart boy named Ahmed, he loves school, he studies every day.</div>';let b=btn('🔊 اسمع القصة','',function(){speakText('There was a smart boy named Ahmed, he loves school','en-US');});d.appendChild(b);return d;}
function pageGames(){let d=document.createElement('div');d.className='card';d.innerHTML='<h3>🎮 لعبة - خمن الكلمة - مع أحمد</h3>';let box=document.createElement('div');d.appendChild(box);let bf=btn('🎲 كلمة جديدة','',function(){renderGame(box);});bf.className='btn';d.appendChild(bf);renderGame(box);return d;}
function renderGame(box){let base=dict[cur.n]||dict['الإنجليزية'];let q=base[Math.floor(Math.random()*base.length)];let others=base.filter(function(x){return x!=q;}).slice(0,2);let opts=[q.for,others[0].for,others[1].for].sort(function(){return Math.random()-0.5;});box.innerHTML='<h3>يا أحمد إيه معنى "<b>'+q.ar+'</b>" بال'+cur.n+'؟</h3>';let optDiv=document.createElement('div');optDiv.id='quizOpt';opts.forEach(function(o){let b=document.createElement('button');b.innerText=o;b.onclick=function(){if(o==q.for){pts+=10;updatePts();alert('صح يا أحمد! خدت 10 نقاط');renderGame(box);}else alert('غلط! حاول تاني يا أحمد');};optDiv.appendChild(b);});box.appendChild(optDiv);}
function pageChat(){let d=document.createElement('div');d.className='card';d.innerHTML='<h3>💬 شات - اتكلم مع أحمد</h3>';let box=document.createElement('div');box.style.cssText='background:#f1f5f9;padding:10px;border-radius:12px;max-height:200px;overflow:auto';box.innerHTML='<div style="background:#fff;padding:10px;border-radius:10px">🤖 أهلا! أنا مساعد أحمد علاء أنور! اكتبلي أهلا وأنا هرد عليك!</div>';let inp=document.createElement('input');inp.placeholder='اكتب هنا...';let b=btn('💬 ابعت دلوقتي','',function(){let txt=inp.value.trim();if(!txt){alert('اكتب حاجة الأول يا أحمد!');return;}box.innerHTML+='<div style="background:#dcfce7;padding:10px;border-radius:10px;margin:6px 0">أحمد: '+txt+'</div>';let reply='عاش يا أحمد! انت بتتكلم '+cur.n+' كويس! جرب تقولي شكرا بال'+cur.n+'!';if(txt.indexOf('أهلا')>=0||txt.indexOf('Hello')>=0)reply='أهلا بيك يا أحمد! عامل إيه النهاردة؟ أ/ سامح زخاري هيكون فخور بيك!';if(txt.indexOf('شكرا')>=0||txt.indexOf('Thank')>=0)reply='العفو يا أحمد! انت شاطر جدا!';box.innerHTML+='<div style="background:#fff;padding:10px;border-radius:10px;margin:6px 0">🤖 مساعد أحمد: '+reply+'</div>';inp.value='';pts+=5;updatePts();});b.className='btn';d.appendChild(box);d.appendChild(inp);d.appendChild(b);return d;}
let verbsAr=['أنا أحب','أنا أريد','أنا أرى','أنا أقرأ','أنا أكتب','أنا ألعب','أنا آكل','أنا أشرب','أنا أذهب إلى','أنا أتعلم'];let verbsEn=['I love','I want','I see','I read','I write','I play','I eat','I drink','I go to','I learn'];let nounsAr=['كتاب','مدرسة','بيت','صديق','تفاح','ماء','قطة','كلب','معلم','درس'];let nounsEn=['book','school','house','friend','apple','water','cat','dog','teacher','lesson'];let adjsAr=['كبير','صغير','جميل','جديد','قديم','سريع','سعيد','ذكي','قوي','رائع'];let adjsEn=['big','small','beautiful','new','old','fast','happy','smart','strong','amazing'];
function pageInfinite(){let d=document.createElement('div');d.className='card';d.innerHTML='<h3>♾️ اللا نهائي - جمل جديدة - مع أحمد</h3>';let box=document.createElement('div');d.appendChild(box);let gen=function(){box.innerHTML='';for(let i=0;i<20;i++){let vi=Math.floor(Math.random()*verbsAr.length),ni=Math.floor(Math.random()*nounsAr.length),ai=Math.floor(Math.random()*adjsAr.length);let arText=verbsAr[vi]+' '+nounsAr[ni]+' '+adjsAr[ai];let enText=verbsEn[vi]+' '+nounsEn[ni]+' '+adjsEn[ai];let x=document.createElement('div');x.className='word';x.innerHTML='<div class="arBox"><span class="ar">'+arText+'</span></div><div class="forBox"><b>'+enText+'</b></div>';let b=btn('🔊','',function(){speakText(enText,cur.c);});x.appendChild(b);box.appendChild(x);}learned+=20;pts+=20;updatePts();};let bf=btn('♾️ ولد 20 جملة جديدة','',gen);bf.className='btn';d.appendChild(bf);gen();return d;}
function pageFav(){let d=document.createElement('div');d.className='card';d.innerHTML='<h3>⭐ مفضلتي - أحمد علاء أنور</h3>';let box=document.createElement('div');if(favs.length==0)box.innerHTML='<p>لسه مفيش كلمات يا أحمد. دوس على ⭐ جنب أي قاعدة أو كلمة عشان تحفظها هنا!</p>';else box.innerHTML=favs.map(function(f){return '<div class="word"><b>'+f+'</b></div>';}).join('');let b=btn('🗑️ امسح المفضلة','',function(){favs=[];go('fav');alert('اتمسحت المفضلة يا أحمد');});b.className='btn';d.appendChild(box);d.appendChild(b);return d;}
function addFav(txt){favs.push(txt);alert('اتحفظت في المفضلة ⭐ يا أحمد: '+txt);}
let tabs={home:'🏠 مقدمة أحمد',langs:'🌍 اللغة',grammar:'📖 900 قاعدة',letters:'🔤 الحروف',words:'📚 اتعلم',translate:'📖 قاموس',quiz:'📝 امتحان القواعد',speak:'🎙️ انطق',stories:'📖 قصص',games:'🎮 لعبة',chat:'💬 شات',infinite:'♾️ لا نهائي',fav:'⭐ مفضلتي'};
let tabEl=document.getElementById('tabs');
for(let k in tabs){let b=document.createElement('button');b.innerText=tabs[k];b.id='tab-'+k;b.onclick=function(){go(k);};tabEl.appendChild(b);}
function go(k){
document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active');});
let tb=document.getElementById('tab-'+k);if(tb)tb.classList.add('active');
let content=document.getElementById('content');content.innerHTML='';
let el=null;
if(k=='home')el=pageHome();if(k=='langs')el=pageLangs();if(k=='grammar')el=pageGrammar();if(k=='letters')el=pageLetters();if(k=='words')el=pageWords();if(k=='translate')el=pageTranslate();if(k=='quiz')el=pageQuiz();if(k=='speak')el=pageSpeak();if(k=='stories')el=pageStories();if(k=='games')el=pageGames();if(k=='chat')el=pageChat();if(k=='infinite')el=pageInfinite();if(k=='fav')el=pageFav();
if(el)content.appendChild(el);
window.scrollTo(0,0);
if(k=='grammar')renderGrammar();
let tr=document.getElementById('totalRules');if(tr)tr.innerText=cur.total||50;
}
go('home');
</script>
</body>
</html>
